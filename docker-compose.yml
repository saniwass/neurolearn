# root

version: "3.9"
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: neurolearn
      POSTGRES_USER: neurolearn
      POSTGRES_PASSWORD: neurolearn
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  api:
    build:
      context: ./services/api
    environment:
      DATABASE_URL: postgresql+psycopg://neurolearn:neurolearn@postgres:5432/neurolearn
      REDIS_URL: redis://redis:6379/0
      QDRANT_URL: http://qdrant:6333
      MINIO_ENDPOINT: minio:9000
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - redis
      - qdrant
      - minio

  worker:
    build:
      context: ./services/worker
    environment:
      DATABASE_URL: postgresql+psycopg://neurolearn:neurolearn@postgres:5432/neurolearn
      REDIS_URL: redis://redis:6379/0
    depends_on:
      - postgres
      - redis

volumes:
  postgres_data:
  qdrant_data:
  minio_data:
